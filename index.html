<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soumyaranjan Dandapat — Backend Engineer</title>
<meta name="description" content="I build Spring Boot services: REST APIs, PostgreSQL, JWT auth.">
<meta name="theme-color" content="#0B0B0C">
<meta property="og:type" content="website">
<meta property="og:title" content="Soumyaranjan Dandapat — Backend Engineer">
<meta property="og:description" content="I build Spring Boot services: REST APIs, PostgreSQL, JWT auth.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  --bg:#0B0B0C;--bg-alt:#0E0E10;--surface:#111113;
  --line:rgba(255,255,255,0.08);--text:#F5F1EA;--muted:#8A857D;--accent:#FF7A1A;
  --key:#C9C5BC;--dim:#6B675F;--ok:#3DDC97;
  --r-sm:8px;--r-md:14px;--r-lg:16px;
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s6:48px;--s8:64px;
  --t1:300ms;--t2:500ms;--ease:cubic-bezier(.22,.7,.2,1);
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sec-pad:112px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:24px 24px;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--r-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:16px;top:-80px;z-index:200;background:var(--accent);color:#0B0B0C;padding:10px 16px;border-radius:var(--r-sm);font-family:var(--f-mono);font-size:13px}
.skip:focus{top:12px}

/* layout */
.wrap{max-width:1200px;margin-inline:auto;padding-inline:24px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
@media(min-width:1024px){.wrap{padding-inline:32px}}
.sec{padding-block:var(--sec-pad);border-top:1px solid var(--line);scroll-margin-top:96px}
.sec.alt{background:var(--bg-alt)}
.sec-left{grid-column:1/5;position:sticky;top:120px;align-self:start}
.sec-right{grid-column:5/13;min-width:0}
.lbl{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:var(--s2)}
.sh{font-family:var(--f-display);font-weight:500;font-size:clamp(32px,4vw,52px);line-height:1.1;letter-spacing:-.01em;overflow:hidden;padding-bottom:.12em}
.sh span{display:block}
.sub{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:var(--s6) 0 var(--s2)}
.sub:first-child{margin-top:0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--line);
  font-family:var(--f-mono);font-size:13px;font-weight:500;white-space:nowrap;
  transition:border-color var(--t1) var(--ease),background var(--t1) var(--ease),color var(--t1) var(--ease),transform var(--t1) var(--ease)}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0B0B0C}
.btn.primary:hover{background:#ff8d3a}
.btn.text{border-color:transparent;padding-inline:8px;color:var(--muted)}
.btn.text:hover{color:var(--text);border-color:transparent}
.btn.sm{height:36px;padding:0 14px;font-size:12px}
.btn.demo-quiet{color:var(--accent);border-color:rgba(255,122,26,.4)}

/* nav */
.nav{position:fixed;z-index:100;top:16px;left:50%;transform:translateX(-50%);width:min(1200px,calc(100% - 32px));height:60px;
  border-radius:var(--r-md);padding:0 20px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(12,12,14,.78);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.prog-clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.prog{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:15px}
.logo b{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--accent);font-weight:500;font-size:13px}
.logo em{font-style:normal;color:var(--accent)}
.links{display:flex;align-items:center;gap:24px;font-family:var(--f-mono);font-size:13px}
.links a.l{position:relative;padding:6px 0;color:var(--muted);transition:color var(--t1) var(--ease)}
.links a.l:hover{color:#fff}
.links a.l::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform var(--t1) var(--ease)}
.links a.l.active{color:var(--accent)}
.links a.l.active::after{transform:scaleX(1)}
.cvbtn{height:34px;padding:0 14px;display:inline-flex;align-items:center;border:1px solid var(--accent);color:var(--accent);border-radius:var(--r-sm);font-family:var(--f-mono);font-size:13px;transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.cvbtn:hover{background:var(--accent);color:#0B0B0C}
.menu-btn{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:var(--r-sm);align-items:center;justify-content:center}
.menu-btn svg{width:18px;height:18px}
.mpanel{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);padding:12px;border-radius:var(--r-md);background:rgba(12,12,14,.96);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:14px}
.mpanel.open{display:flex}
.mpanel a{padding:12px;border-radius:var(--r-sm);color:var(--muted)}
.mpanel a:hover,.mpanel a.active{color:var(--accent)}
.mpanel .cvbtn{height:44px;justify-content:center;margin-top:4px}
@media(max-width:959px){
  .links{display:none}.menu-btn{display:inline-flex}
}
@media(max-width:767px){
  .nav{top:12px;width:calc(100% - 24px);height:56px;padding:0 12px 0 14px}
  .logo{font-size:13px}
  :root{--sec-pad:72px}
}

/* hero */
.hero{padding:132px 0 0;scroll-margin-top:0}
.hero-grid{align-items:center;row-gap:48px}
.hero-text{grid-column:1/6;min-width:0}
.hero-term{grid-column:6/13;min-width:0}
.pill{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);max-width:100%}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.hname{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,2.4vw,30px);letter-spacing:0;margin-top:var(--s3);color:var(--text)}
h1.headline{font-family:var(--f-display);font-weight:500;font-size:clamp(38px,4.2vw,60px);line-height:1.05;letter-spacing:-.01em;margin-top:var(--s2)}
@supports (width:1cqw){.hero-text{container-type:inline-size}h1.headline{font-size:clamp(26px,10cqw,60px)}}
.headline .lead{display:block;font-style:italic;font-weight:400;color:var(--muted)}
.role-mask{display:grid;overflow:hidden;padding-bottom:6px;max-width:100%}
.role{grid-area:1/1;justify-self:start;position:relative;width:max-content;max-width:100%;padding-bottom:10px;color:var(--text);
  transform:translateY(100%);opacity:0;transition:transform 650ms var(--ease),opacity 650ms var(--ease)}
.role i{font-style:normal;color:var(--accent)}
.role::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left}
.role.on{transform:none;opacity:1}
.role.on::after{transform:scaleX(1);transition:transform 600ms var(--ease) 250ms}
.role.out{transform:translateY(-100%);opacity:0}
.role:not(.on):not(.out){transition:none}
.tagline{font-size:19px;line-height:1.55;max-width:34em;margin-top:var(--s3);color:#d9d4cb;text-wrap:pretty}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:var(--s4)}
.connect{display:flex;align-items:center;gap:20px;margin-top:var(--s4);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.connect a{display:inline-flex;align-items:center;gap:8px;color:var(--text);transition:color var(--t1) var(--ease)}
.connect a:hover{color:var(--accent)}
.connect svg{width:16px;height:16px}
.strip{margin-top:var(--s8);border-top:1px solid var(--line);padding:20px 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.strip b{font-weight:400;color:var(--accent)}
.strip .r{color:var(--text)}
@media(max-width:899px){
  .hero-text,.hero-term{grid-column:1/-1}
}
@media(max-width:767px){.hero{padding-top:100px}.tagline{font-size:17px}.hero-cta .btn.text{padding-inline:0;height:32px}}

/* terminal */
.term{display:flex;flex-direction:column;background:#08080A;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;font-family:var(--f-mono)}
.t-bar{display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:7px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.14)}
.t-title{font-size:12px;color:var(--muted);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-copy{font-size:12px;color:var(--muted);padding:4px 8px;border-radius:6px;transition:color var(--t1) var(--ease)}
.t-copy:hover{color:var(--accent)}
.t-tabs{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.t-tabs button{min-height:36px;padding:0 14px;border-radius:var(--r-sm);font-size:12px;color:var(--muted);transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.t-tabs button:hover{color:var(--text)}
.t-tabs button[aria-selected="true"]{background:rgba(255,122,26,.12);color:var(--accent)}
.t-main{position:relative;flex:1;display:flex;flex-direction:column}
.t-body{flex:1;font-size:13px;line-height:1.65;padding:18px 22px;overflow:hidden;color:var(--text)}
.ln{white-space:pre-wrap;padding-left:var(--h,0ch);text-indent:calc(var(--h,0ch) * -1);min-height:1.65em}
.ln .k{color:var(--key)}.ln .s{color:var(--text)}.ln .n{color:var(--accent)}.ln .p{color:var(--dim)}
.ln .u{overflow-wrap:anywhere}
.ln a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere;word-break:break-all}
.ln a:hover{text-decoration:underline}
.pr{color:var(--accent)}.cmd{color:#e9e4da}
.caret{display:inline-block;width:.6em;height:1.15em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1.1s steps(1) infinite;text-indent:0}
@keyframes blink{50%{opacity:0}}
.t-status{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 22px;font-size:11px;color:var(--muted)}
.t-status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.t-measure{position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none}
@media(max-width:767px){
  .t-body{flex:none;max-height:360px;overflow-y:auto}
  .t-main::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(transparent,#08080A);pointer-events:none}
  .t-body{font-size:12px;padding:16px}
}

/* projects */
.plist{border-bottom:1px solid var(--line)}
.proj{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 16px;padding:var(--s4) 0;border-top:1px solid var(--line);outline-offset:-2px}
.proj:first-child{border-top-color:var(--line)}
.proj::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform var(--t1) var(--ease)}
.p-idx{font-family:var(--f-mono);font-size:28px;line-height:1.2;color:var(--muted);transition:color var(--t1) var(--ease)}
.p-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;transition:transform var(--t1) var(--ease)}
.p-name{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,2.6vw,30px);line-height:1.15;letter-spacing:-.01em}
.proj.featured .p-name{font-size:clamp(30px,3.4vw,44px)}
.p-sub{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tagpill{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid rgba(255,122,26,.4);border-radius:999px;padding:2px 10px}
.p-sum{margin-top:12px;color:#d0cbc2;max-width:42em;text-wrap:pretty}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tags li{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 10px;transition:color var(--t1) var(--ease),border-color var(--t1) var(--ease)}
.proj:hover .tags li{border-color:rgba(255,255,255,.14)}
.p-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.proj:hover::before,.proj:focus-visible::before{transform:scaleX(1)}
.proj:hover .p-idx,.proj:focus-visible .p-idx{color:var(--accent)}
.proj:hover .p-head,.proj:focus-visible .p-head{transform:translateX(6px)}
@media(max-width:767px){.proj{grid-template-columns:1fr}.p-idx{font-size:20px;margin-bottom:8px}}

/* about */
.portrait{position:relative;width:min(240px,100%);aspect-ratio:4/5;margin-top:var(--s4);border-radius:var(--r-md);border:1px solid var(--line);overflow:hidden;background:var(--surface);outline-offset:3px}
.portrait .fb{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:40px;color:var(--accent)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:grayscale(1) contrast(1.05);transition:filter var(--t2) var(--ease)}
.portrait:hover img,.portrait:focus-visible img,.portrait.color img{filter:none}
.bio{font-size:19px;line-height:1.65;max-width:36em;color:#d9d4cb;text-wrap:pretty}
.tl{position:relative;margin-left:6px;padding-left:28px}
.tl::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl li,.edu{position:relative;padding:20px 24px;margin-bottom:16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);transition:border-color var(--t1) var(--ease),transform var(--t1) var(--ease)}
.tl li:hover,.edu:hover{border-color:rgba(255,122,26,.5);transform:translateY(-2px)}
.tl li::before{content:"";position:absolute;left:-33px;top:28px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.t-role{font-family:var(--f-display);font-size:22px;font-weight:500;line-height:1.2}
.t-meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.t-line{margin-top:10px;color:#d0cbc2}
.edu .cg{font-family:var(--f-mono);color:var(--accent)}
.edu{margin-left:6px}
@media(max-width:767px){.tl li::before{left:-29px}.tl{padding-left:22px}}

/* skills */
.sk-main .chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{font-size:17px;padding:10px 18px;border:1px solid rgba(255,122,26,.5);border-radius:var(--r-sm);transition:background var(--t1) var(--ease),transform var(--t1) var(--ease),border-color var(--t1) var(--ease)}
.chip:hover{background:rgba(255,122,26,.1);border-color:var(--accent);transform:translateY(-2px)}
.sk-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;padding:16px 0 0;border-top:1px solid var(--line);margin-top:var(--s2)}
.sk-row:first-of-type{margin-top:var(--s4)}
.sk-row:last-child{padding-bottom:0}
.sk-g{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px}
.sk-items{color:#d0cbc2}
.sk-items .it{transition:color var(--t1) var(--ease)}
.sk-items .it:hover{color:var(--accent)}
.sk-items .sep{color:var(--dim)}
@media(max-width:767px){.sk-row{grid-template-columns:1fr}}

/* contact */
.c-status{color:#cfc9bf;font-size:19px}
.c-mail{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:var(--s3)}
.c-mail a.addr{font-family:var(--f-mono);font-size:clamp(20px,2.6vw,32px);overflow-wrap:anywhere;transition:color var(--t1) var(--ease)}
.c-mail a.addr:hover{color:var(--accent)}
.c-links{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:var(--s4);font-family:var(--f-mono);font-size:14px}
.c-links a{color:var(--muted);transition:color var(--t1) var(--ease)}
.c-links a:hover{color:var(--accent)}
footer{border-top:1px solid var(--line);background:var(--bg-alt);padding:32px 0;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px}
footer nav{display:flex;gap:20px}
footer a{transition:color var(--t1) var(--ease)}footer a:hover{color:var(--accent)}

@media(max-width:767px){
  .sec-left,.sec-right{grid-column:1/-1}
  .sec-left{position:static;margin-bottom:var(--s4)}
  .portrait{margin-top:var(--s3)}
}

/* motion (hidden initial states only when JS is running) */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.js .hero-text>*{animation:rise 600ms var(--ease) both;animation-delay:calc(var(--i,0) * 80ms)}
.js .hero-term{animation:rise 700ms var(--ease) both;animation-delay:560ms}
.js .reveal{opacity:0;transform:translateY(16px);transition:opacity var(--t2) var(--ease),transform var(--t2) var(--ease);transition-delay:calc(var(--i,0) * 80ms)}
.js .reveal.in{opacity:1;transform:none}
.js .sec-left .lbl{opacity:0;transform:translateX(-14px);transition:opacity var(--t2) var(--ease),transform var(--t2) var(--ease)}
.js .sec-left .sh span{transform:translateY(105%);transition:transform 700ms var(--ease) 120ms}
.js .sec-left.in .lbl{opacity:1;transform:none}
.js .sec-left.in .sh span{transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .reveal,.js .sec-left .lbl,.js .sec-left .sh span{opacity:1!important;transform:none!important}
  .caret{animation:none}
  .role:not(.on){visibility:hidden}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header>
  <nav class="nav" id="nav" aria-label="Primary">
    <a class="logo" href="#top" aria-label="Home"><b>SD</b><span>soumyaranjan<em>.backend</em></span></a>
    <div class="links" id="navlinks"></div>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mpanel" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

async function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(e){}

}

const T=(c,v)=>({c,v});
const tl=t=>t.c==='s'?t.v.length+2:t.c==='k'?t.v.length+2:t.v.length;
const plen=a=>a.reduce((n,t)=>n+tl(t),0);
function prim(v){ return typeof v==='string'?T('s',v):T('n',String(v)); }
function inl(v){
  if(Array.isArray(v)){ const t=[T('p','[')]; v.forEach((x,i)=>{ if(i)t.push(T('p',', ')); t.push(...inl(x)); }); t.push(T('p',']')); return t; }
  if(v&&typeof v==='object'){ const t=[T('p','{ ')]; Object.keys(v).forEach((k,i)=>{ if(i)t.push(T('p',', ')); t.push(T('k',k),T('p',': '),...inl(v[k])); }); t.push(T('p',' }')); return t; }
  return [prim(v)];
}
function layout(root){
  const L=[]; const add=(ind,tokens,hang)=>L.push({ind,tokens,hang});
  const pair=(ind,k,v,comma,lead)=>{ const pre=[...(lead?[T('p',lead)]:[]),T('k',k),T('p',': ')]; add(ind,[...pre,...inl(v),...(comma?[T('p',comma)]:[])],ind+plen(pre)+1); };
  if(Array.isArray(root)){
    add(0,[T('p','[')],0);
    root.forEach((o,i)=>{
      const keys=Object.keys(o), tail=i<root.length-1?',':'';
      keys.forEach((k,j)=>{
        const last=j===keys.length-1;
        const pre=[...(j===0?[T('p','{ ')]:[]),T('k',k),T('p',': ')];
        const trail=last?[T('p',' }'+tail)]:[T('p',',')];
        add(j===0?2:4,[...pre,...inl(o[k]),...trail],(j===0?2:4)+plen(pre)+1);
      });
    });
    add(0,[T('p',']')],0);
  } else {
    add(0,[T('p','{')],0);
    const keys=Object.keys(root);
    keys.forEach((k,i)=>pair(2,k,root[k],i<keys.length-1?',':''));
    add(0,[T('p','}')],0);
  }
  return L;
}
function tokHTML(t){
  if(t.c==='s'){

  return `<span class="${t.c}">${esc(t.v)}</span>`;
}

async function show(tab,animate){
  const id=++runId; current=tab;
  $$('button',tabsEl).forEach(b=>{const on=b.dataset.tab===tab;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;});
  body.setAttribute('aria-labelledby','tab-'+tab);
  if(!animate||reduced){ body.innerHTML=finalHTML(tab); if(!reduced){ body.lastElementChild.append(mkCaret()); } return; }

  const pl=document.createElement('div'); pl.className='ln'; pl.innerHTML='<span class="pr">$</span> <span class="cmd"></span>';
  body.append(pl); const caret=mkCaret(); pl.append(caret); const cmdEl=pl.querySelector('.cmd');
  for(let i=1;i<=cmd.length;i++){ cmdEl.textContent=cmd.slice(0,i); await sleep(18); if(id!==runId)return; }
  await sleep(90); if(id!==runId)return;
  const ls=layout(RESP[tab]()); const step=Math.min(25,650/ls.length);

  const np=document.createElement('div'); np.className='ln'; np.innerHTML='<span class="pr">$</span> '; body.append(np); np.append(caret);
}

/* never-clip sizing: render every response off-screen at real width/font, take the tallest */
const heroText=$('#heroText');
let lastW=0;
function measure(){
  const isMobile=matchMedia('(max-width:767px)').matches, stacked=matchMedia('(max-width:899px)').matches;
  const cs=getComputedStyle(body);
  const bw=body.clientWidth; if(!bw)return;
  const m=document.createElement('div'); m.className='t-body t-measure'; m.style.cssText=`width:${bw}px;max-height:none;font-size:${cs.fontSize};padding:${cs.padding}`;
  document.querySelector('.t-main').append(m);
  let tallest=0; TABS.forEach(t=>{ m.innerHTML=finalHTML(t); tallest=Math.max(tallest,m.offsetHeight); }); m.remove();
  if(isMobile){ body.style.minHeight=Math.min(tallest,360)+'px'; return; }
  body.style.minHeight='0px';
  const chrome=term.offsetHeight-body.offsetHeight;
  let base=Math.max(tallest, Math.round(term.offsetWidth/1.6)-chrome);           // ~16:10 landscape
  body.style.minHeight=base+'px';
  if(!stacked){ const diff=heroText.offsetHeight-term.offsetHeight; if(diff>term.offsetHeight*0.15*0+0 && heroText.offsetHeight>term.offsetHeight*1.15){ base+=diff; body.style.minHeight=base+'px'; } }
}
let mt; const remeasure=()=>{clearTimeout(mt);mt=setTimeout(measure,60);};
new ResizeObserver(()=>{ const w=term.offsetWidth; if(w!==lastW){lastW=w;remeasure();} }).observe(term);
addEventListener('resize',remeasure);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(remeasure);
measure();
body.innerHTML=promptHTML(cmdOf('about')).replace('</div>','</div>');
if(reduced){ show('about',false); } else { setTimeout(()=>show('about',true),reduced?0:900); }

/* ============================ rotating role ============================== */
(function roles(){
  const mask=$('#roleMask');
  mask.innerHTML=ROLES.map((r,i)=>`<span class="role${i===0?' on':''}">${esc(r)}<i>.</i></span>`).join('');
  const els=$$('.role',mask); let ri=0,timer,paused=false;
  const schedule=()=>{clearTimeout(timer);timer=setTimeout(next,ri===0?HOLD_FIRST:HOLD_REST);};
  function next(){ if(paused||document.hidden){schedule();return;} go((ri+1)%ROLES.length); }
  function go(n){ const old=els[ri]; old.classList.remove('on'); old.classList.add('out'); setTimeout(()=>old.classList.remove("out"),680); els[n].classList.add('on'); ri=n; schedule(); }
  const h1=$('#h1');
  h1.addEventListener('mouseenter',()=>paused=true); h1.addEventListener('mouseleave',()=>paused=false);
  h1.addEventListener('focusin',()=>paused=true); h1.addEventListener('focusout',()=>paused=false);
  schedule();
  // fit: shrink the headline just enough that the widest role never clips or runs under the terminal
  const col=$('#heroText');
  function fit(){
    h1.style.fontSize='';
    const room=col.clientWidth; let max=0;
    els.forEach(r=>{ max=Math.max(max,r.scrollWidth); });
    if(max>room){ const fs=parseFloat(getComputedStyle(h1).fontSize); h1.style.fontSize=Math.max(24,Math.floor(fs*room/max*0.98))+'px'; }
  }
  fit();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  let ft; addEventListener('resize',()=>{clearTimeout(ft);ft=setTimeout(fit,80);});
})();

/* ================================== nav ================================== */
const prog=$('#prog');
let ticking=false;
function onScroll(){ if(ticking)return; ticking=true; requestAnimationFrame(()=>{ const h=document.documentElement.scrollHeight-innerHeight; prog.style.transform=`scaleX(${h>0?Math.min(1,scrollY/h):0})`; setActive(); ticking=false; }); }
addEventListener('scroll',onScroll,{passive:true}); onScroll();

const secIds=NAV.map(n=>n[0]); const live=new Set();
function setActive(){
  let act=null; secIds.forEach(id=>{ if(live.has(id)) act=id; });
  // the last section is short, so at the very bottom of the page treat it as current
  if(scrollY>0 && innerHeight+scrollY>=document.documentElement.scrollHeight-4) act=secIds[secIds.length-1];
  $$('[data-sec]').forEach(a=>{ const on=a.dataset.sec===act; a.classList.toggle('active',on); if(on)a.setAttribute('aria-current','true'); else a.removeAttribute('aria-current'); });
}
if('IntersectionObserver' in window){
  // a section counts as "current" once its top has passed 40% of the viewport height
  const so=new IntersectionObserver(es=>{ es.forEach(e=>{ e.isIntersecting?live.add(e.target.id):live.delete(e.target.id); }); setActive(); },{rootMargin:'0px 0px -60% 0px',threshold:0});
  secIds.forEach(id=>so.observe($('#'+id)));
}
const mbtn=$('#menuBtn'), mpanel=$('#mpanel');
function setMenu(o){ mpanel.classList.toggle('open',o); mbtn.setAttribute('aria-expanded',o); }
mbtn.addEventListener('click',()=>setMenu(!mpanel.classList.contains('open')));
mpanel.addEventListener('click',e=>{ if(e.target.closest('a')) setMenu(false); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&mpanel.classList.contains('open')){ setMenu(false); mbtn.focus(); } });
addEventListener('resize',()=>{ if(innerWidth>=960)setMenu(false); });

/* ================================ reveals ================================ */
const revealEls=$$('.reveal,.sec-left');
if('IntersectionObserver' in window && !reduced){
  const ro=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); ro.unobserve(e.target); } }),{rootMargin:'0px 0px -8% 0px',threshold:0.05});
  revealEls.forEach(el=>ro.observe(el));
} else { revealEls.forEach(el=>el.classList.add('in')); }

/* portrait: colour on scroll-to-middle for touch devices */
if(matchMedia('(hover: none)').matches && 'IntersectionObserver' in window){
  const p=$('#portrait');
  new IntersectionObserver(es=>es.forEach(e=>p.classList.toggle('color',e.isIntersecting)),{rootMargin:'-40% 0px -40% 0px'}).observe(p);
}
})();
</script>
